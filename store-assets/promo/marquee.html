<!DOCTYPE html>
<!-- Chrome Web Store marquee promo tile, 1400×560. Rendered to ../promo-marquee-1400x560.png by scripts/render-promo.js.
     The logo's step line grown into a price history: a drop, a small rise, a big drop — caught at the dot. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; }
  body { width: 1400px; height: 560px; overflow: hidden; position: relative;
         background: linear-gradient(135deg, #3d8bff, #1656cc); color: #fff;
         font-family: "Avenir Next", sans-serif; -webkit-font-smoothing: antialiased; }
  svg { position: absolute; inset: 0; }
  .copy { position: absolute; left: 96px; top: 176px; }
  .name { font-weight: 600; font-size: 80px; line-height: 1; letter-spacing: -.025em; }
  .line { margin-top: 22px; font-weight: 500; font-size: 29px; line-height: 1.35; color: #dce8ff; max-width: 540px; text-wrap: balance; }
  /* Each past price is right-aligned to the end of its run: 30px before the step (half the stroke + a gap). */
  .price { position: absolute; transform: translateX(-100%); font-family: "DIN Alternate", sans-serif; font-weight: 700; font-size: 30px; line-height: 1; }
  .price.now { font-size: 46px; transform: none; }
</style></head><body>
  <svg viewBox="0 0 1400 560" width="1400" height="560" aria-hidden="true">
    <path d="M-30 104 H600 V236 H780 V196 H960 V436 H1170" fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1170" cy="436" r="32" fill="#fff"/>
  </svg>
  <div class="price" style="left:570px; top:52px">€329</div>
  <div class="price" style="left:750px; top:184px">€279</div>
  <div class="price" style="left:930px; top:144px">€289</div>
  <div class="price now" style="left:1224px; top:414px">€249</div>
  <div class="copy">
    <div class="name">BuyTracker</div>
    <div class="line">Know when the price drops, a new offer appears or it’s back in stock.</div>
  </div>
</body></html>
