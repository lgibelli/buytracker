name = "buytracker-recipes"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Lets index.js import the repo-root privacy.html as a string, served at GET /privacy
# (the public privacy-policy URL for the Chrome Web Store listing).
rules = [{ type = "Text", globs = ["**/*.html"], fallthrough = true }]

# Per-site parse recipes are cached here, keyed by hostname.
# Create the namespace once, then paste its id below:
#   wrangler kv namespace create RECIPES
[[kv_namespaces]]
binding = "RECIPES"
id = "bdfacf3797584743a270c2c6211a84b6"

# Rate-limit counters, the daily AI meter, and the reports users choose to send (required). Create once:
#   wrangler d1 create buytracker-reports      # paste the printed id below
#   wrangler d1 migrations apply buytracker-reports --remote
[[d1_databases]]
binding = "REPORTS"
database_name = "buytracker-reports"
database_id = "79216ad0-0b93-4901-bd15-07e35723d606"

# Workers AI writes the recipes (worker/src/derive.js). Free tier: 10,000 neurons a day.
[ai]
binding = "AI"

[vars]
# Model for recipe derivation: Qwen3 30B wrote correct recipes on every store tested, at ~30 neurons each.
MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"

# Hard daily cap on AI spend, in Workers AI neurons: reserved before each call, settled from the reply.
# Once reached, POST /recipe returns 429 with Retry-After until UTC midnight; the extension backs off and
# retries. 3,300 is a third of Workers AI's free 10,000 a day, which the whole account shares — on the
# Workers Paid plan usage above 10,000 is billed, so this keeps room for anything else on the account.
DAILY_NEURONS = "3300"

# Secret (DO NOT put it here — set it with `wrangler secret put`):
#   wrangler secret put AUTH_TOKEN   # a long random string: unlocks the logs and DELETE /recipe for you,
#                                    # and keys the hash used to rate-limit clients
