name = "buytracker-recipes"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Lets index.js import the repo-root privacy.html as a string, served at GET /privacy
# (the public privacy-policy URL for the Chrome Web Store listing).
rules = [{ type = "Text", globs = ["**/*.html"], fallthrough = true }]

# Per-site parse recipes are cached here, keyed by hostname.
# Create the namespace once, then paste its id below:
#   wrangler kv namespace create RECIPES
[[kv_namespaces]]
binding = "RECIPES"
id = "bdfacf3797584743a270c2c6211a84b6"

# Optional: user "report wrong result" submissions are logged here for you to review later
# (host, url, the correction, note, outcome, cost). Reporting still works without this binding —
# the worker skips logging when it's absent, so this stays commented out by default (a placeholder
# id would fail `wrangler deploy`). To enable: create the DB, UNCOMMENT the block below, paste the
# printed id, then apply the migration:
#   wrangler d1 create buytracker-reports
#   wrangler d1 migrations apply buytracker-reports --remote
# Review anytime with:  wrangler d1 execute buytracker-reports --remote \
#   --command "SELECT ts,host,correct_availability,correct_price,note,outcome FROM reports ORDER BY ts DESC LIMIT 50"
[[d1_databases]]
binding = "REPORTS"
database_name = "buytracker-reports"
database_id = "79216ad0-0b93-4901-bd15-07e35723d606"

[vars]
# Default model for recipe derivation. Override per-deploy if you like.
MODEL = "claude-haiku-4-5"

# Hard daily spend cap (USD) for derivation, metered from real token usage. Once reached, POST
# /recipe returns 429 with Retry-After until UTC midnight; the extension backs off and retries.
DAILY_BUDGET_USD = "1"

# Secrets (DO NOT put these here — set them with `wrangler secret put`):
#   wrangler secret put ANTHROPIC_KEY   # your sk-ant-... key, kept server-side
#   wrangler secret put AUTH_TOKEN      # a long random string the extension must send
